name: CI

on:
  push:
    branches: [main, master, Vonxuvin/Week5Task]
  pull_request:
    branches: [main, master, Vonxuvin/Week5Task]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v5
        with:
          path: .tsbuildinfo
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-

      - name: TypeScript 类型检查 (tsc --noEmit)
        run: npm run typecheck

      - name: 运行单元测试 (含覆盖率)
        run: npx vitest run --pool=threads --reporter=verbose --coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-report
          path: |
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  smoke-e2e:
    name: Smoke E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Smoke E2E Tests
        run: npx playwright test --grep @smoke --project=chromium-desktop

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 运行集成测试
        run: npm run test:integration

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-report
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-tests:
    needs: [lint-and-unit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/e2e-shard-job.yml
    with:
      project: chromium-desktop
      shard-index: ${{ matrix.shard }}
      shard-total: 4
      artifact-prefix: playwright-report

  e2e-tests-mobile:
    needs: [lint-and-unit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/e2e-shard-job.yml
    with:
      project: chromium-mobile
      shard-index: ${{ matrix.shard }}
      shard-total: 4
      artifact-prefix: playwright-report-mobile

  e2e-tests-small-mobile:
    needs: [lint-and-unit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/e2e-shard-job.yml
    with:
      project: chromium-small-mobile
      shard-index: ${{ matrix.shard }}
      shard-total: 4
      artifact-prefix: playwright-report-small-mobile

  e2e-tests-tablet:
    needs: [lint-and-unit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/e2e-shard-job.yml
    with:
      project: chromium-tablet
      shard-index: ${{ matrix.shard }}
      shard-total: 4
      artifact-prefix: playwright-report-tablet

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 构建项目
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7