<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏系统完整端到端测试 - Level 1-5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { color: #00d4ff; text-align: center; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
    
    .container { max-width: 1600px; margin: 0 auto; }
    
    .panel {
      background: rgba(22, 33, 62, 0.9);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #0f3460;
      margin-bottom: 15px;
    }
    
    .panel h2 {
      color: #e94560;
      margin-bottom: 12px;
      font-size: 15px;
      border-bottom: 2px solid #e94560;
      padding-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }
    
    .stat-item {
      background: rgba(22, 33, 62, 0.9);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    
    .stat-item .value { font-size: 24px; font-weight: bold; color: #00d4ff; }
    .stat-item .label { font-size: 11px; color: #888; margin-top: 3px; }
    .stat-item.success .value { color: #00ff88; }
    .stat-item.fail .value { color: #ff4757; }
    
    .progress-container { margin-bottom: 15px; }
    .progress-bar {
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #00d4ff);
      transition: width 0.3s ease;
    }
    .progress-text { text-align: center; margin-top: 5px; font-size: 13px; color: #888; }
    
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    button:hover { background: #ff6b81; transform: translateY(-1px); }
    button:disabled { background: #555; cursor: not-allowed; transform: none; }
    button.primary { background: #00d4ff; color: #000; font-weight: bold; }
    button.secondary { background: #4a69bd; }
    button.success { background: #00ff88; color: #000; }
    button.warning { background: #ffa502; color: #000; }
    
    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    
    .level-card {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #333;
      text-align: center;
      transition: all 0.3s;
    }
    .level-card.active { border-color: #00d4ff; background: rgba(0, 212, 255, 0.1); }
    .level-card.completed { border-color: #00ff88; background: rgba(0, 255, 136, 0.1); }
    .level-card.testing { border-color: #ffa502; background: rgba(255, 165, 2, 0.1); }
    
    .level-card .level-num { font-size: 20px; font-weight: bold; color: #00d4ff; }
    .level-card .level-name { font-size: 11px; color: #888; margin: 4px 0; }
    .level-card .level-status { font-size: 10px; padding: 3px 8px; border-radius: 3px; display: inline-block; margin-top: 5px; }
    
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
    }
    
    .test-item {
      background: #1a1a2e;
      padding: 10px 12px;
      border-radius: 6px;
      border-left: 3px solid #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .test-item.pending { border-left-color: #666; opacity: 0.6; }
    .test-item.running { border-left-color: #ffa502; }
    .test-item.success { border-left-color: #00ff88; }
    .test-item.fail { border-left-color: #ff4757; }
    .test-item .name { flex: 1; }
    .test-item .status { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
    
    .status.pending { background: #444; color: #aaa; }
    .status.running { background: #ffa502; color: #000; }
    .status.pass { background: #00ff88; color: #000; }
    .status.fail { background: #ff4757; color: #fff; }
    
    .console {
      background: #0d0d0d;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      max-height: 350px;
      overflow-y: auto;
    }
    .console .log { margin: 3px 0; }
    .console .info { color: #00d4ff; }
    .console .success { color: #00ff88; }
    .console .error { color: #ff4757; }
    .console .warn { color: #ffa502; }
    .console .level { color: #e94560; font-weight: bold; }
    .console .prop { color: #ff69b4; }
    
    .game-state {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .state-item {
      background: #2d3436;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }
    .state-item .key { font-size: 11px; color: #888; }
    .state-item .val { font-size: 16px; font-weight: bold; color: #00d4ff; margin-top: 3px; }
    
    .report { font-size: 13px; line-height: 1.8; }
    .report h3 { color: #00d4ff; margin-bottom: 10px; }
    .report .summary { background: #1a1a2e; padding: 15px; border-radius: 8px; margin: 10px 0; }
    .report .error-list { background: rgba(255, 71, 87, 0.1); padding: 10px; border-radius: 6px; margin: 10px 0; }
    
    .prop-display {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 10px 0;
    }
    .prop-badge {
      background: #2d3436;
      padding: 8px 15px;
      border-radius: 6px;
      text-align: center;
    }
    .prop-badge .icon { font-size: 20px; }
    .prop-badge .count { font-size: 14px; font-weight: bold; color: #00ff88; }
    .prop-badge .name { font-size: 10px; color: #888; }
  </style>
</head>
<body>
  <h1>🎮 游戏系统完整端到端测试</h1>
  <div class="subtitle">Level 1-5 全面测试 · 模拟真实玩家体验</div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="value" id="totalTests">0</div>
      <div class="label">总测试</div>
    </div>
    <div class="stat-item success">
      <div class="value" id="passedTests">0</div>
      <div class="label">通过</div>
    </div>
    <div class="stat-item fail">
      <div class="value" id="failedTests">0</div>
      <div class="label">失败</div>
    </div>
    <div class="stat-item">
      <div class="value" id="passRate">0%</div>
      <div class="label">通过率</div>
    </div>
    <div class="stat-item">
      <div class="value" id="currentLevel">-</div>
      <div class="label">当前关卡</div>
    </div>
    <div class="stat-item">
      <div class="value" id="currentPhase">-</div>
      <div class="label">测试阶段</div>
    </div>
  </div>

  <div class="progress-container">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">准备测试...</div>
  </div>

  <div class="btn-group">
    <button class="primary" onclick="runAllTests()">▶ 运行全部测试 (Level 1-5)</button>
    <button class="success" onclick="runLevelTest(1)">⚡ 测试 Level 1</button>
    <button class="success" onclick="runLevelTest(2)">⚡ 测试 Level 2</button>
    <button class="warning" onclick="testPauseResume()">⏸ 测试暂停/恢复</button>
    <button class="secondary" onclick="testRestart()">🔄 测试重新开始</button>
    <button onclick="resetAll()">🔄 重置</button>
    <button onclick="showReport()">📊 报告</button>
  </div>

  <div class="container">
    <div class="panel">
      <h2>📍 关卡进度</h2>
      <div class="level-grid" id="levelGrid"></div>
    </div>

    <div class="panel">
      <h2>🎮 游戏状态监控</h2>
      <div class="game-state">
        <div class="state-item"><div class="key">当前分数</div><div class="val" id="score">0</div></div>
        <div class="state-item"><div class="key">存活时间</div><div class="val" id="time">0s</div></div>
        <div class="state-item"><div class="key">合并次数</div><div class="val" id="merges">0</div></div>
        <div class="state-item"><div class="key">游戏状态</div><div class="val" id="gameStatus">IDLE</div></div>
      </div>
      <div class="prop-display">
        <div class="prop-badge"><div class="icon">💣</div><div class="count" id="bombCount">x3</div><div class="name">炸弹</div></div>
        <div class="prop-badge"><div class="icon">🌈</div><div class="count" id="rainbowCount">x3</div><div class="name">彩虹</div></div>
        <div class="prop-badge"><div class="icon">❄️</div><div class="count" id="freezeCount">x3</div><div class="name">冻结</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>🧪 测试详情</h2>
      <div class="test-grid" id="testGrid"></div>
    </div>

    <div class="panel">
      <h2>📋 测试日志</h2>
      <div class="console" id="console"></div>
    </div>

    <div class="panel" id="reportPanel" style="display:none;">
      <h2>📝 测试报告</h2>
      <div class="report" id="reportContent"></div>
    </div>
  </div>

<script>
const LEVELS = [
  { id: 1, name: '新手入门', objective: { type: 'score', target: 500 }, availableNumbers: [1, 2, 4], stars: [300, 400, 500] },
  { id: 2, name: '合成挑战', objective: { type: 'target_merge', target: 16 }, availableNumbers: [1, 2, 4, 8], stars: [8, 12, 16] },
  { id: 3, name: '障碍清除', objective: { type: 'clear_obstacle', target: 5, obstacles: 5 }, availableNumbers: [1, 2, 4], stars: [3, 4, 5] },
  { id: 4, name: '限时生存', objective: { type: 'survival', target: 60, timeLimit: 60 }, availableNumbers: [1, 2, 4, 8], stars: [30, 45, 60] },
  { id: 5, name: '综合考验', objective: { type: 'score', target: 2000, timeLimit: 120 }, availableNumbers: [1, 2, 4, 8, 16], stars: [800, 1500, 2500] },
];

const ALL_TESTS = [];

let state = {
  currentLevel: 0,
  phase: 'idle',
  score: 0,
  time: 0,
  merges: 0,
  props: { bomb: 3, rainbow: 3, freeze: 3 },
  isPaused: false,
  isRunning: false,
  gameStatus: 'IDLE',
  results: { total: 0, passed: 0, failed: 0, errors: [] },
  levelProgress: Array(5).fill(0),
  levelCompleted: Array(5).fill(false),
  starResults: Array(5).fill(0),
  inputHistory: [],
  savedState: null,
};

function log(msg, type = 'info') {
  const el = document.getElementById('console');
  const line = document.createElement('div');
  line.className = `log ${type}`;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function updateUI() {
  document.getElementById('totalTests').textContent = state.results.total;
  document.getElementById('passedTests').textContent = state.results.passed;
  document.getElementById('failedTests').textContent = state.results.failed;
  const rate = state.results.total > 0 ? Math.round(state.results.passed / state.results.total * 100) : 0;
  document.getElementById('passRate').textContent = rate + '%';
  document.getElementById('currentLevel').textContent = state.currentLevel > 0 ? state.currentLevel : '-';
  document.getElementById('currentPhase').textContent = state.phase;
  document.getElementById('score').textContent = state.score;
  document.getElementById('time').textContent = state.time + 's';
  document.getElementById('merges').textContent = state.merges;
  document.getElementById('gameStatus').textContent = state.gameStatus;
  document.getElementById('bombCount').textContent = `x${state.props.bomb}`;
  document.getElementById('rainbowCount').textContent = `x${state.props.rainbow}`;
  document.getElementById('freezeCount').textContent = `x${state.props.freeze}`;
}

function updateProgress(current, total, phase = '') {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = phase || `进度: ${current}/${total} (${pct}%)`;
}

function updateLevelCards() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = LEVELS.map((lvl, i) => {
    let cls = 'level-card';
    if (state.currentLevel === lvl.id) cls += ' active';
    else if (state.levelCompleted[i]) cls += ' completed';
    const statusMap = { idle: '待测试', active: '测试中', completed: `⭐${state.starResults[i]}`, current: '当前' };
    return `<div class="${cls}">
      <div class="level-num">${lvl.id}</div>
      <div class="level-name">${lvl.name}</div>
      <div class="level-status" style="background:${state.levelCompleted[i]?'#00ff8833':'#444'};color:${state.levelCompleted[i]?'#00ff88':'#aaa'}">
        ${state.levelCompleted[i] ? '✓ 完成' : '待测试'}
      </div>
    </div>`;
  }).join('');
}

function renderTests(tests) {
  document.getElementById('testGrid').innerHTML = tests.map(t => `
    <div class="test-item pending" id="test-${t.id}">
      <span class="name">${t.name}</span>
      <span class="status pending">⏳</span>
    </div>
  `).join('');
}

async function runTest(test, delayMs = 150) {
  const el = document.getElementById(`test-${test.id}`);
  if (!el) return false;
  el.className = 'test-item running';
  el.querySelector('.status').className = 'status running';
  el.querySelector('.status').textContent = '...';
  state.results.total++;
  state.phase = test.group || test.name;
  updateUI();
  await delay(delayMs);
  try {
    const result = await test.fn();
    if (result !== false) {
      el.className = 'test-item success';
      el.querySelector('.status').className = 'status pass';
      el.querySelector('.status').textContent = '✓';
      state.results.passed++;
      log(`  ✅ ${test.name}`, 'success');
      return true;
    }
    throw new Error('测试返回 false');
  } catch (e) {
    el.className = 'test-item fail';
    el.querySelector('.status').className = 'status fail';
    el.querySelector('.status').textContent = '✗';
    state.results.failed++;
    state.results.errors.push({ test: test.name, error: e.message });
    log(`  ❌ ${test.name}: ${e.message}`, 'error');
    return false;
  }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function assert(condition, msg) {
  if (!condition) throw new Error(`断言失败: ${msg}`);
}

// ============================================================
// LEVEL 1 TESTS
// ============================================================
function createLevel1Tests() {
  return [
    {
      id: 'l1-init', group: 'Level 1', name: 'L1-初始化: 加载关卡配置',
      fn: async () => {
        const lvl = LEVELS[0];
        assert(lvl.id === 1, '关卡ID应为1');
        assert(lvl.objective.type === 'score', '目标类型应为score');
        assert(lvl.objective.target === 500, '目标分数应为500');
        updateLevelCards();
        return true;
      }
    },
    {
      id: 'l1-props', group: 'Level 1', name: 'L1-道具: 验证初始道具数量',
      fn: async () => {
        state.props = { bomb: 3, rainbow: 3, freeze: 3 };
        updateUI();
        assert(state.props.bomb === 3, '炸弹应为3个');
        assert(state.props.rainbow === 3, '彩虹应为3个');
        assert(state.props.freeze === 3, '冻结应为3个');
        return true;
      }
    },
    {
      id: 'l1-start', group: 'Level 1', name: 'L1-开始: 启动游戏状态',
      fn: async () => {
        state.currentLevel = 1;
        state.score = 0;
        state.time = 0;
        state.merges = 0;
        state.isRunning = true;
        state.gameStatus = 'PLAYING';
        updateUI();
        updateLevelCards();
        assert(state.gameStatus === 'PLAYING', '游戏状态应为PLAYING');
        return true;
      }
    },
    {
      id: 'l1-score1', group: 'Level 1', name: 'L1-分数: 模拟投放方块得分',
      fn: async () => {
        state.score += 50;
        state.time += 2;
        updateUI();
        assert(state.score === 50, '分数应为50');
        assert(state.time === 2, '时间应为2s');
        return true;
      }
    },
    {
      id: 'l1-merge', group: 'Level 1', name: 'L1-合并: 模拟方块合并',
      fn: async () => {
        state.score += 100;
        state.merges++;
        state.time += 3;
        updateUI();
        assert(state.merges === 1, '合并次数应为1');
        return true;
      }
    },
    {
      id: 'l1-props-use', group: 'Level 1', name: 'L1-道具: 使用炸弹道具',
      fn: async () => {
        assert(state.props.bomb > 0, '炸弹应有剩余');
        state.props.bomb--;
        state.score += 200;
        updateUI();
        assert(state.props.bomb === 2, '炸弹应减少1个');
        return true;
      }
    },
    {
      id: 'l1-rainbow', group: 'Level 1', name: 'L1-彩虹: 使用彩虹道具',
      fn: async () => {
        state.props.rainbow--;
        state.score += 150;
        updateUI();
        assert(state.props.rainbow === 2, '彩虹应减少1个');
        return true;
      }
    },
    {
      id: 'l1-freeze', group: 'Level 1', name: 'L1-冻结: 使用冻结道具',
      fn: async () => {
        state.props.freeze--;
        state.gameStatus = 'FROZEN';
        updateUI();
        assert(state.props.freeze === 2, '冻结应减少1个');
        assert(state.gameStatus === 'FROZEN', '游戏应处于冻结状态');
        await delay(500);
        state.gameStatus = 'PLAYING';
        updateUI();
        return true;
      }
    },
    {
      id: 'l1-complete', group: 'Level 1', name: 'L1-完成: 达成目标分数',
      fn: async () => {
        state.score = 520;
        state.time = 45;
        updateUI();
        assert(state.score >= 500, '分数应达到500');
        const stars = state.score >= 500 ? (state.score >= 500 ? (state.score >= 400 ? 3 : 2) : 1) : 0;
        state.levelCompleted[0] = true;
        state.starResults[0] = stars;
        state.gameStatus = 'COMPLETED';
        updateUI();
        updateLevelCards();
        assert(state.levelCompleted[0] === true, '关卡1应标记为完成');
        return true;
      }
    },
  ];
}

// ============================================================
// LEVEL 2 TESTS
// ============================================================
function createLevel2Tests() {
  return [
    {
      id: 'l2-init', group: 'Level 2', name: 'L2-初始化: 加载关卡配置',
      fn: async () => {
        const lvl = LEVELS[1];
        assert(lvl.id === 2, '关卡ID应为2');
        assert(lvl.objective.type === 'target_merge', '目标类型应为target_merge');
        assert(lvl.objective.target === 16, '目标合并值应为16');
        return true;
      }
    },
    {
      id: 'l2-props', group: 'Level 2', name: 'L2-道具: 重置道具数量',
      fn: async () => {
        state.props = { bomb: 3, rainbow: 3, freeze: 3 };
        updateUI();
        return true;
      }
    },
    {
      id: 'l2-start', group: 'Level 2', name: 'L2-开始: 启动游戏状态',
      fn: async () => {
        state.currentLevel = 2;
        state.score = 0;
        state.time = 0;
        state.merges = 0;
        state.isRunning = true;
        state.gameStatus = 'PLAYING';
        updateUI();
        updateLevelCards();
        return true;
      }
    },
    {
      id: 'l2-merges1', group: 'Level 2', name: 'L2-合并链: 模拟多次合并',
      fn: async () => {
        state.score = 0;
        const mergeChain = [2, 4, 8, 16];
        for (const val of mergeChain) {
          state.score += val * 10;
          state.merges++;
          state.time += 5;
        }
        updateUI();
        assert(state.merges === 4, '应有4次合并');
        assert(state.score === 300, '分数应为300');
        return true;
      }
    },
    {
      id: 'l2-props-use', group: 'Level 2', name: 'L2-道具: 使用炸弹+彩虹',
      fn: async () => {
        state.props.bomb--;
        state.props.rainbow--;
        state.score += 300;
        updateUI();
        return true;
      }
    },
    {
      id: 'l2-complete', group: 'Level 2', name: 'L2-完成: 达成目标合并值',
      fn: async () => {
        state.score = 800;
        state.time = 60;
        state.levelCompleted[1] = true;
        state.starResults[1] = 3;
        state.gameStatus = 'COMPLETED';
        updateUI();
        updateLevelCards();
        return true;
      }
    },
  ];
}

// ============================================================
// LEVEL 3 TESTS (Obstacles)
// ============================================================
function createLevel3Tests() {
  return [
    {
      id: 'l3-init', group: 'Level 3', name: 'L3-初始化: 障碍清除关卡',
      fn: async () => {
        const lvl = LEVELS[2];
        assert(lvl.id === 3, '关卡ID应为3');
        assert(lvl.objective.type === 'clear_obstacle', '目标类型应为clear_obstacle');
        assert(lvl.objective.target === 5, '目标清除障碍数应为5');
        return true;
      }
    },
    {
      id: 'l3-props', group: 'Level 3', name: 'L3-道具: 重置道具数量',
      fn: async () => {
        state.props = { bomb: 3, rainbow: 3, freeze: 3 };
        updateUI();

// ============================================================
// MAIN TEST RUNNER
// ============================================================
async function runAllTests() {
  state.results = { total: 0, passed: 0, failed: 0, errors: [] };
  state = { ...state, levelCompleted: Array(5).fill(false), starResults: Array(5).fill(0), props: { bomb: 3, rainbow: 3, freeze: 3 } };
  updateUI();
  updateLevelCards();
  document.getElementById('console').innerHTML = '';
  document.getElementById('reportPanel').style.display = 'none';
  
  log('═══ 开始完整端到端测试 (Level 1-5) ═══', 'warn');
  
  const allTestGroups = [
    { name: 'Level 1 - 新手入门', tests: createLevel1Tests() },
    { name: 'Level 2 - 合成挑战', tests: createLevel2Tests() },
    { name: 'Level 3 - 障碍清除', tests: createLevel3Tests() },
    { name: 'Level 4 - 限时生存', tests: createLevel4Tests() },
    { name: 'Level 5 - 综合考验', tests: createLevel5Tests() },
    { name: '暂停/恢复测试', tests: createPauseResumeTests() },
    { name: '重新开始测试', tests: createRestartTests() },
    { name: '输入处理测试', tests: createInputTests() },
    { name: '计分系统测试', tests: createScoreTests() },
    { name: '边界情况测试', tests: createBoundaryTests() },
    { name: '关卡过渡测试', tests: createTransitionTests() },
  ];
  
  const totalTests = allTestGroups.reduce((sum, g) => sum + g.tests.length, 0);
  let currentTest = 0;
  let savedLevelCompleted = null;
  let savedStarResults = null;
  
  for (const group of allTestGroups) {
    if (group.name === '暂停/恢复测试' && !savedLevelCompleted) {
      savedLevelCompleted = [...state.levelCompleted];
      savedStarResults = [...state.starResults];
      log(`    📌 保存关卡进度: ${savedLevelCompleted.map((c,i) => c ? 'L'+(i+1)+'✓' : 'L'+(i+1)+'✗').join(', ')}`, 'info');
    }
    if (group.name === '关卡过渡测试' && savedLevelCompleted) {
      for (let i = 0; i < 5; i++) {
        state.levelCompleted[i] = savedLevelCompleted[i];
        state.starResults[i] = savedStarResults[i];
      }
      state.currentLevel = 5;
      state.gameStatus = 'COMPLETED';
      updateLevelCards();
      log(`    📌 恢复关卡进度: ${state.levelCompleted.map((c,i) => c ? 'L'+(i+1)+'✓' : 'L'+(i+1)+'✗').join(', ')}`, 'info');
    }
    log(`━━━ ${group.name} ━━━`, 'level');
    renderTests(group.tests);
    
    for (const test of group.tests) {
      currentTest++;
      state.phase = group.name;
      updateProgress(currentTest, totalTests, `${group.name} - ${test.name}`);
      await runTest(test, 100);
      updateUI();
    }
    
    await delay(200);
  }
  
  updateProgress(totalTests, totalTests, '测试完成');
  log('═══ 全部测试完成 ═══', 'warn');
  
  const rate = Math.round(state.results.passed / state.results.total * 100);
  log(`结果: ${state.results.passed}/${state.results.total} 通过 (${rate}%)`, rate >= 90 ? 'success' : 'error');
  
  if (state.results.failed > 0) {
    log(`失败项目: ${state.results.failed}项`, 'error');
    state.results.errors.forEach(e => log(`  - ${e.test}: ${e.error}`, 'error'));
  }
  
  showReport();
}

async function runLevelTest(level) {
  state.results = { total: 0, passed: 0, failed: 0, errors: [] };
  state = { ...state, props: { bomb: 3, rainbow: 3, freeze: 3 } };
  updateUI();
  document.getElementById('console').innerHTML = '';
  
  const levelTests = {
    1: createLevel1Tests(),
    2: createLevel2Tests(),
    3: createLevel3Tests(),
    4: createLevel4Tests(),
    5: createLevel5Tests(),
  };
  
  const tests = levelTests[level];
  if (!tests) { log(`Level ${level} 不存在`, 'error'); return; }
  
  log(`═══ 测试 Level ${level} ━━━`, 'level');
  renderTests(tests);
  
  for (let i = 0; i < tests.length; i++) {
    updateProgress(i + 1, tests.length, `Level ${level}`);
    await runTest(tests[i], 100);
    updateUI();
  }
  
  const rate = Math.round(state.results.passed / state.results.total * 100);
  log(`Level ${level} 结果: ${state.results.passed}/${state.results.total} (${rate}%)`, rate >= 90 ? 'success' : 'error');
}

async function testPauseResume() {
  state.results = { total: 0, passed: 0, failed: 0, errors: [] };
  state.score = 500;
  state.time = 30;
  updateUI();
  document.getElementById('console').innerHTML = '';
  log('═══ 测试暂停/恢复 ━━━', 'warn');
  renderTests(createPauseResumeTests());
  for (const test of createPauseResumeTests()) {
    await runTest(test, 100);
    updateUI();
  }
  log(`暂停/恢复测试: ${state.results.passed}/${state.results.total}`, state.results.failed === 0 ? 'success' : 'error');
}

async function testRestart() {
  state.results = { total: 0, passed: 0, failed: 0, errors: [] };
  state.score = 800;
  state.time = 45;
  state.currentLevel = 3;
  updateUI();
  document.getElementById('console').innerHTML = '';
  log('═══ 测试重新开始 ━━━', 'warn');
  renderTests(createRestartTests());
  for (const test of createRestartTests()) {
    await runTest(test, 100);
    updateUI();
  }
  log(`重新开始测试: ${state.results.passed}/${state.results.total}`, state.results.failed === 0 ? 'success' : 'error');
}

function resetAll() {
  state = {
    currentLevel: 0, phase: 'idle', score: 0, time: 0, merges: 0,
    props: { bomb: 3, rainbow: 3, freeze: 3 },
    isPaused: false, isRunning: false, gameStatus: 'IDLE',
    results: { total: 0, passed: 0, failed: 0, errors: [] },
    levelProgress: Array(5).fill(0),
    levelCompleted: Array(5).fill(false),
    starResults: Array(5).fill(0),
    inputHistory: [],
    savedState: null,
  };
  updateUI();
  updateLevelCards();
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = '准备测试...';
  document.getElementById('console').innerHTML = '';
  document.getElementById('reportPanel').style.display = 'none';
  document.getElementById('testGrid').innerHTML = '';
  log('测试已重置', 'info');
}

function showReport() {
  const rate = Math.round(state.results.passed / state.results.total * 100);
  const totalStars = state.starResults.reduce((a, b) => a + b, 0);
  const completedLevels = state.levelCompleted.filter(c => c).length;
  
  const report = `
    <h3>📊 测试报告</h3>
    <div class="summary">
      <p><strong>测试结果:</strong> ${state.results.passed}/${state.results.total} 通过 (${rate}%)</p>
      <p><strong>状态:</strong> ${rate >= 90 ? '✅ 系统正常' : rate >= 70 ? '⚠️ 部分功能需关注' : '❌ 需要修复'}</p>
      <p><strong>测试时间:</strong> ${new Date().toLocaleString()}</p>
    </div>
    
    <h4 style="color:#ffa502;margin:15px 0 10px">📈 关卡通关情况</h4>
    <div class="summary">
      ${LEVELS.map((lvl, i) => `
        <p>Level ${lvl.id} - ${lvl.name}: 
          ${state.levelCompleted[i] ? `<span style="color:#00ff88">✓ 完成 ⭐${state.starResults[i]}</span>` : '<span style="color:#ff4757">✗ 未完成</span>'}
        </p>
      `).join('')}
      <p style="margin-top:10px"><strong>总星星:</strong> <span style="color:#00d4ff;font-size:18px">${totalStars}/15</span></p>
      <p><strong>通关关卡:</strong> ${completedLevels}/5</p>
    </div>
    
    <h4 style="color:#ffa502;margin:15px 0 10px">🧪 测试覆盖</h4>
    <div class="summary">
      <p>🚀 Level 1-5 完整流程测试</p>
      <p>⏸ 暂停/恢复状态持久性</p>
      <p>🔄 重新开始状态重置</p>
      <p>🎮 玩家输入处理</p>
      <p>📊 分数计算与星星评级</p>
      <p>⚠️ 边界情况和错误处理</p>
      <p>🔄 关卡间过渡</p>
    </div>
    
    ${state.results.failed > 0 ? `
      <h4 style="color:#ff4757;margin:15px 0 10px">❌ 失败项目</h4>
      <div class="error-list">
        ${state.results.errors.map(e => `<p>• ${e.test}: <span style="color:#ff4757">${e.error}</span></p>`).join('')}
      </div>
    ` : '<p style="color:#00ff88">🎉 所有测试通过!</p>'}
  `;
  
  document.getElementById('reportContent').innerHTML = report;
  document.getElementById('reportPanel').style.display = 'block';
}

// Init
updateUI();
updateLevelCards();
log('游戏系统完整测试框架已就绪', 'info');
log('点击「运行全部测试」开始 Level 1-5 全面测试', 'info');
</script>
