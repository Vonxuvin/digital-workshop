<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道具系统集成测试 v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      min-height: 100vh;
    }
    h1 { color: #00d4ff; margin-bottom: 20px; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }
    .test-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .panel {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #0f3460;
    }
    .panel h2 {
      color: #e94560;
      margin-bottom: 15px;
      font-size: 18px;
      border-bottom: 2px solid #e94560;
      padding-bottom: 8px;
    }
    .test-item {
      background: #1a1a2e;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-item.success { border-left: 4px solid #00ff88; }
    .test-item.fail { border-left: 4px solid #ff4757; }
    .test-item.pending { border-left: 4px solid #ffa502; }
    .test-name { font-weight: 500; flex: 1; }
    .test-detail { font-size: 11px; color: #888; margin-top: 2px; }
    .test-result {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      white-space: nowrap;
      margin-left: 10px;
    }
    .test-result.pass { background: #00ff88; color: #000; }
    .test-result.fail { background: #ff4757; color: #fff; }
    .test-result.pending { background: #ffa502; color: #000; }
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
      transition: all 0.2s;
    }
    button:hover { background: #ff6b81; transform: translateY(-2px); }
    button:disabled { background: #555; cursor: not-allowed; transform: none; }
    .btn-group { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .console {
      background: #0d0d0d;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      max-height: 350px;
      overflow-y: auto;
      margin-top: 15px;
    }
    .console .log { margin: 4px 0; }
    .console .info { color: #00d4ff; }
    .console .success { color: #00ff88; }
    .console .error { color: #ff4757; }
    .console .warn { color: #ffa502; }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #16213e;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-value { font-size: 28px; font-weight: bold; color: #00d4ff; }
    .stat-label { font-size: 12px; color: #888; margin-top: 5px; }
    .full-width { grid-column: 1 / -1; }
    .loading { text-align: center; padding: 40px; color: #ffa502; }
    .fix-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      background: #e94560;
      color: #fff;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>🎮 道具系统集成测试 v2</h1>
  <div class="subtitle">验证道具系统 4 项修复：FreezeProp物理管理器 | 炸弹目标模式 | 道具特效连接 | 彩虹方块逻辑</div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="totalTests">0</div>
      <div class="stat-label">总测试数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="passedTests">0</div>
      <div class="stat-label">通过</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="failedTests">0</div>
      <div class="stat-label">失败</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="passRate">0%</div>
      <div class="stat-label">通过率</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="fixCoverage">0/4</div>
      <div class="stat-label">修复覆盖</div>
    </div>
  </div>

  <div class="test-container">
    <div class="panel">
      <h2>❄️ Fix#1: FreezeProp 物理管理器接入</h2>
      <div id="freezeFixTests"></div>
    </div>

    <div class="panel">
      <h2>💣 Fix#2: 炸弹目标模式点击接通</h2>
      <div id="bombFixTests"></div>
    </div>

    <div class="panel">
      <h2>💥 Fix#3: 道具特效事件连接</h2>
      <div id="effectFixTests"></div>
    </div>

    <div class="panel">
      <h2>🌈 Fix#4: 彩虹方块投放逻辑</h2>
      <div id="rainbowFixTests"></div>
    </div>

    <div class="panel">
      <h2>📦 基础设施测试</h2>
      <div id="infraTests"></div>
    </div>

    <div class="panel">
      <h2>🔧 重置与清理测试</h2>
      <div id="cleanupTests"></div>
    </div>

    <div class="panel full-width">
      <h2>📋 测试控制台</h2>
      <div class="btn-group">
        <button onclick="runAllTests()">▶ 运行全部测试</button>
        <button onclick="runFixTests()">🔧 仅运行修复验证</button>
        <button onclick="clearConsole()">🗑 清空控制台</button>
      </div>
      <div class="console" id="console"></div>
    </div>
  </div>

  <div id="loading" class="loading">正在加载游戏模块...</div>

  <script>
    let testResults = { total: 0, passed: 0, failed: 0 };
    let fixResults = { total: 0, passed: 0 };
    let sourceCache = {};

    async function fetchSource(url) {
      if (sourceCache[url]) return sourceCache[url];
      try {
        const response = await fetch(url);
        if (response.status !== 200) return null;
        const text = await response.text();
        sourceCache[url] = text;
        return text;
      } catch {
        return null;
      }
    }

    async function loadGameModule() {
      log('正在加载游戏模块...', 'info');
      
      try {
        const files = [
          '/src/core/Game.ts',
          '/src/gameplay/Block.ts',
          '/src/gameplay/props/PropSystem.ts',
          '/src/gameplay/props/FreezeProp.ts',
          '/src/gameplay/props/BombProp.ts',
          '/src/gameplay/props/RainbowProp.ts',
          '/src/ui/hud/GameHUD.ts',
          '/src/ui/effects/ExplosionEffect.ts',
          '/src/ui/effects/FreezeEffect.ts',
          '/src/data/props/props.json',
        ];
        
        for (const f of files) {
          const src = await fetchSource(f);
          log(`${f}: ${src ? '✅ 加载成功 (' + src.length + ' bytes)' : '❌ 未找到'}`, src ? 'success' : 'error');
        }

        document.getElementById('loading').style.display = 'none';
        initTests();
        log('模块加载完成，可以开始测试', 'success');

      } catch (error) {
        log(`加载失败: ${error.message}`, 'error');
        document.getElementById('loading').innerHTML = `
          <div style="color: #ff4757;">加载失败: ${error.message}</div>
          <div style="margin-top: 10px; font-size: 12px; color: #888;">
            请确保开发服务器正在运行 (npm run dev)
          </div>
        `;
      }
    }

    const tests = {
      freezeFix: [
        { 
          name: 'Game.ts 导入或使用 FreezeProp', 
          detail: 'Game.ts 应引用 FreezeProp（可能被Vite内联）',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && (src.includes("FreezeProp") || src.includes('freezeProp'));
          }
        },
        { 
          name: 'initializeProps 调用 setPhysicsManager', 
          detail: 'initializeProps() 中应调用 freezeProp.setPhysicsManager(this.physics)',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            const hasSetPM = src.includes('setPhysicsManager') && src.includes('this.physics');
            const inInitProps = src.includes('freezeProp.setPhysicsManager(this.physics)');
            return hasSetPM && inInitProps;
          }
        },
        { 
          name: 'FreezeProp 有 setPhysicsManager 方法', 
          detail: 'FreezeProp 类定义了 setPhysicsManager(physicsManager: PhysicsManager)',
          fn: async () => {
            const src = await fetchSource('/src/gameplay/props/FreezeProp.ts');
            return src !== null && src.includes('setPhysicsManager');
          }
        },
        { 
          name: 'FreezeProp 使用 physicsManager.stop/start', 
          detail: '冻结时调用 physicsManager.stop(), 解冻时调用 physicsManager.start()',
          fn: async () => {
            const src = await fetchSource('/src/gameplay/props/FreezeProp.ts');
            if (!src) return false;
            return src.includes('physicsManager.stop()') && src.includes('physicsManager.start()');
          }
        },
      ],
      bombFix: [
        { 
          name: 'Game.ts 监听 ui:propTargetMode 事件', 
          detail: 'setupEventListeners 中注册 ui:propTargetMode 监听',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes("'ui:propTargetMode'");
          }
        },
        { 
          name: 'Game.ts 有 bombTargetMode 状态变量', 
          detail: '声明 private bombTargetMode 属性',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes('bombTargetMode');
          }
        },
        { 
          name: 'handlePropTargetMode 处理方法存在', 
          detail: '处理 propTargetMode 事件，设置 bombTargetMode 标志',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('handlePropTargetMode') && 
                   src.includes('this.bombTargetMode = data.enabled');
          }
        },
        { 
          name: 'onDown 拦截 bombTargetMode 点击', 
          detail: 'input.onDown 中 bombTargetMode 为 true 时跳过预览显示',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('this.bombTargetMode') && 
                   src.includes("if (this.bombTargetMode) return") &&
                   src.includes('onDown');
          }
        },
        { 
          name: 'onUp 处理炸弹目标点击', 
          detail: 'input.onUp 中 bombTargetMode 时调用 gameHUD.usePropAtPosition',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('this.bombTargetMode') && 
                   src.includes('usePropAtPosition') &&
                   src.includes('input.getState().position');
          }
        },
      ],
      effectFix: [
        { 
          name: 'Game.ts 监听 props:bomb:explode 事件', 
          detail: '注册爆炸事件监听，触发 ExplosionEffect',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes("'props:bomb:explode'");
          }
        },
        { 
          name: 'Game.ts 监听 props:freeze:activated 事件', 
          detail: '注册冻结激活事件监听，触发 FreezeEffect',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes("'props:freeze:activated'");
          }
        },
        { 
          name: 'Game.ts 监听 props:freeze:deactivated 事件', 
          detail: '注册冻结解除事件监听，销毁 FreezeEffect',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes("'props:freeze:deactivated'");
          }
        },
        { 
          name: 'handleBombExplode 创建 ExplosionEffect', 
          detail: '爆炸处理方法中 new ExplosionEffect 并添加到 stage',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('new ExplosionEffect') && 
                   src.includes('app.stage.addChild(effect)') &&
                   src.includes('handleBombExplode');
          }
        },
        { 
          name: 'handleBombExplode 销毁受影响方块', 
          detail: '爆炸时通过 getAffectedBlocks 获取并销毁范围内的方块',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('getAffectedBlocks') && 
                   src.includes('physics.removeBody(block.body)') &&
                   src.includes('block.destroy()');
          }
        },
        { 
          name: 'handleFreezeActivated 创建 FreezeEffect', 
          detail: '冻结处理方法中 new FreezeEffect 并播放入场动画',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('new FreezeEffect') && 
                   src.includes('playEntrance') &&
                   src.includes('handleFreezeActivated');
          }
        },
        { 
          name: '导入 ExplosionEffect 和 FreezeEffect', 
          detail: 'Game.ts 顶部导入了两个特效类',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && 
                   src.includes('import { ExplosionEffect }') &&
                   src.includes('import { FreezeEffect }');
          }
        },
      ],
      rainbowFix: [
        { 
          name: 'Game.ts 监听 gameplay:nextBlock 事件', 
          detail: '注册彩虹方块事件监听',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes("'gameplay:nextBlock'");
          }
        },
        { 
          name: 'Game.ts 监听 props:rainbow:consumed 事件', 
          detail: '注册彩虹消耗事件监听以更新剩余计数',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes("'props:rainbow:consumed'");
          }
        },
        { 
          name: 'Game.ts 有 rainbowRemaining 计数器', 
          detail: '声明并使用 rainbowRemaining 追踪彩虹方块数量',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('rainbowRemaining') && 
                   src.includes('this.rainbowRemaining > 0');
          }
        },
        { 
          name: 'dropBlock 支持创建彩虹方块', 
          detail: 'dropBlock 中检查 rainbowRemaining > 0 并传 isRainbowBlock 给 Block 构造函数',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('isRainbowBlock') && 
                   src.includes('new Block(body, value, isRainbowBlock)');
          }
        },
        { 
          name: 'dropBlock 消耗彩虹方块', 
          detail: '投放彩虹方块后调用 rainbowProp.consumeRainbowBlock()',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes('consumeRainbowBlock()');
          }
        },
        { 
          name: 'Block 类支持 isRainbow 参数', 
          detail: 'Block 构造函数接受第三个参数 isRainbow',
          fn: async () => {
            const src = await fetchSource('/src/gameplay/Block.ts');
            if (!src) return false;
            return (src.includes('isRainbow') && src.includes('constructor')) || 
                   src.includes('isRainbow = false') ||
                   src.includes('isRainbow: boolean');
          }
        },
        { 
          name: 'Block 绘制区分彩虹外观', 
          detail: 'drawBlock() 中根据 isRainbow 使用不同颜色绘制（Vite可能将hex转为十进制）',
          fn: async () => {
            const src = await fetchSource('/src/gameplay/Block.ts');
            if (!src) return false;
            return src.includes('this.isRainbow') && 
                   (src.includes('FF69B4') || src.includes('0xFF69B4') || src.includes('16738740') || src.includes('rainbow'));
          }
        },
        { 
          name: 'Game.ts 导入或使用 RainbowProp', 
          detail: '需要引用 RainbowProp 以调用 consumeRainbowBlock（可能被Vite内联）',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && (src.includes("RainbowProp") || src.includes('rainbowProp'));
          }
        },
      ],
      infra: [
        { 
          name: 'PropSystem 单例模式正确', 
          detail: 'PropSystem 使用 getInstance() 单例',
          fn: async () => {
            const src = await fetchSource('/src/gameplay/props/PropSystem.ts');
            return src !== null && src.includes('getInstance()') && src.includes('static instance');
          }
        },
        { 
          name: 'BombProp 导入正确', 
          detail: 'Game.ts 导入 BombProp 用于 getAffectedBlocks',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            return src !== null && src.includes('import { BombProp }');
          }
        },
        { 
          name: 'destroy() 清理所有新监听器', 
          detail: 'destroy 中 off 所有新增的 6 个事件监听（Vite可能转换单双引号）',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            let count = 0;
            const patterns = ['props:bomb:explode', 'props:freeze:activated', 'props:freeze:deactivated', 'ui:propTargetMode', 'gameplay:nextBlock', 'props:rainbow:consumed'];
            for (const p of patterns) {
              if (src.includes('off(') && src.includes(p)) count++;
            }
            return count >= 6;
          }
        },
        { 
          name: '道具配置文件完整', 
          detail: 'props.json 包含至少 3 种道具配置',
          fn: async () => {
            const src = await fetchSource('/src/data/props/props.json');
            if (!src) return false;
            try {
              const data = JSON.parse(src);
              return data.props && data.props.length >= 3;
            } catch { return false; }
          }
        },
      ],
      cleanup: [
        { 
          name: 'resetGame 重置 bombTargetMode', 
          detail: 'resetGame() 中将 bombTargetMode 设为 false',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('this.bombTargetMode = false') && src.includes('resetGame');
          }
        },
        { 
          name: 'resetGame 重置 rainbowRemaining', 
          detail: 'resetGame() 中将 rainbowRemaining 设为 0',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('this.rainbowRemaining = 0') && src.includes('resetGame');
          }
        },
        { 
          name: 'resetGame 清理 freezeEffect', 
          detail: 'resetGame() 中销毁 freezeEffect',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('freezeEffect') && 
                   src.includes('freezeEffect.destroy()') &&
                   src.includes('freezeEffect = null');
          }
        },
        { 
          name: 'handleRestart 重置道具系统', 
          detail: 'restart 时调用 propSystem.reset() 和 initializeProps()',
          fn: async () => {
            const src = await fetchSource('/src/core/Game.ts');
            if (!src) return false;
            return src.includes('propSystem.reset()') && 
                   src.includes('initializeProps()') &&
                   src.includes('handleRestart');
          }
        },
        { 
          name: 'GameHUD.exitPropTargetMode 在 reset 中调用', 
          detail: 'GameHUD.reset() 会退出目标模式',
          fn: async () => {
            const src = await fetchSource('/src/ui/hud/GameHUD.ts');
            return src !== null && src.includes('exitPropTargetMode') && src.includes('reset()');
          }
        },
      ],
    };

    function log(message, type = 'info') {
      const consoleEl = document.getElementById('console');
      const line = document.createElement('div');
      line.className = `log ${type}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function clearConsole() {
      document.getElementById('console').innerHTML = '';
    }

    function updateStats() {
      document.getElementById('totalTests').textContent = testResults.total;
      document.getElementById('passedTests').textContent = testResults.passed;
      document.getElementById('failedTests').textContent = testResults.failed;
      document.getElementById('passRate').textContent = 
        testResults.total > 0 ? Math.round(testResults.passed / testResults.total * 100) + '%' : '0%';
      document.getElementById('fixCoverage').textContent = `${fixResults.passed}/4`;
    }

    function renderTests(category, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      tests[category].forEach((test, index) => {
        const item = document.createElement('div');
        item.className = 'test-item pending';
        item.id = `test-${category}-${index}`;
        item.innerHTML = `
          <div>
            <div class="test-name">${test.name}</div>
            ${test.detail ? `<div class="test-detail">${test.detail}</div>` : ''}
          </div>
          <span class="test-result pending">⏳</span>
        `;
        container.appendChild(item);
      });
    }

    function setTestResult(category, index, passed, message = '') {
      const item = document.getElementById(`test-${category}-${index}`);
      if (!item) return;
      item.className = `test-item ${passed ? 'success' : 'fail'}`;
      item.querySelector('.test-result').className = `test-result ${passed ? 'pass' : 'fail'}`;
      item.querySelector('.test-result').textContent = passed ? '✓ PASS' : '✗ FAIL';
      if (message) item.title = message;
      testResults.total++;
      if (passed) testResults.passed++;
      else testResults.failed++;
      updateStats();
    }

    async function runTests(category, containerId, isFixCategory = false) {
      renderTests(category, containerId);
      log(`━━━ 开始 [${category}] 测试 ━━━`, 'warn');
      let catPassed = 0;
      for (let i = 0; i < tests[category].length; i++) {
        await new Promise(r => setTimeout(r, 80));
        try {
          const result = await tests[category][i].fn();
          setTestResult(category, i, result, '');
          const status = result ? '✅' : '❌';
          log(`  ${status} ${tests[category][i].name}`, result ? 'success' : 'error');
          if (result) catPassed++;
        } catch (e) {
          setTestResult(category, i, false, e.message);
          log(`  ❌ ${tests[category][i].name} - 异常: ${e.message}`, 'error');
        }
      }
      const allPass = catPassed === tests[category].length;
      if (isFixCategory) {
        if (allPass) fixResults.passed++;
        log(`[${category}] 完成: ${catPassed}/${tests[category].length} ${allPass ? '✅ 全部通过' : '⚠️ 存在失败'}`, allPass ? 'success' : 'warn');
      } else {
        log(`[${category}] 完成: ${catPassed}/${tests[category].length}`, 'info');
      }
    }

    function initTests() {
      renderTests('freezeFix', 'freezeFixTests');
      renderTests('bombFix', 'bombFixTests');
      renderTests('effectFix', 'effectFixTests');
      renderTests('rainbowFix', 'rainbowFixTests');
      renderTests('infra', 'infraTests');
      renderTests('cleanup', 'cleanupTests');
      log('测试框架已初始化，共 ' + Object.values(tests).reduce((s, t) => s + t.length, 0) + ' 项测试', 'info');
    }

    window.runAllTests = async () => {
      testResults = { total: 0, passed: 0, failed: 0 };
      fixResults = { total: 4, passed: 0 };
      updateStats();
      clearConsole();
      log('═══ 开始全部集成测试 ═══', 'warn');
      await runTests('freezeFix', 'freezeFixTests', true);
      await runTests('bombFix', 'bombFixTests', true);
      await runTests('effectFix', 'effectFixTests', true);
      await runTests('rainbowFix', 'rainbowFixTests', true);
      await runTests('infra', 'infraTests', false);
      await runTests('cleanup', 'cleanupTests', false);
      const rate = Math.round(testResults.passed / testResults.total * 100);
      log(`═══ 全部测试完成 ═══`, 'info');
      log(`总计: ${testResults.passed}/${testResults.total} 通过 (${rate}%)`, rate >= 90 ? 'success' : 'error');
      log(`修复覆盖: ${fixResults.passed}/4 项修复全部验证通过`, fixResults.passed === 4 ? 'success' : 'warn');
    };

    window.runFixTests = async () => {
      testResults = { total: 0, passed: 0, failed: 0 };
      fixResults = { total: 4, passed: 0 };
      updateStats();
      clearConsole();
      log('═══ 仅运行修复验证测试 ═══', 'warn');
      await runTests('freezeFix', 'freezeFixTests', true);
      await runTests('bombFix', 'bombFixTests', true);
      await runTests('effectFix', 'effectFixTests', true);
      await runTests('rainbowFix', 'rainbowFixTests', true);
      const rate = Math.round(testResults.passed / testResults.total * 100);
      log(`修复验证完成: ${fixResults.passed}/4 项修复通过 (${rate}%)`, fixResults.passed === 4 ? 'success' : 'error');
    };

    window.clearConsole = clearConsole;

    loadGameModule();
  </script>
</body>
</html>
